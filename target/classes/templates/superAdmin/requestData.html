<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>

<div th:fragment="requestData">

    <div class="highlight-box">
        <p>Request Data List</p>
    </div>

    <div class="row">
        <div class="col-sm-12 firstDiv">

            <div class="leftDiv">

                <div style="text-align: right;">
                    <button class="btn btn-sm text-black small-button showButton"
                            style="display:none;">
                        &lt;
                    </button>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-2">

                    <!-- Left: Page Size Selector -->
                    <div th:replace="global/modal :: pageSizeSelector(${pageSize})">
                    </div>

                    <!-- Right: Search Box -->
                    <div style="width: 250px;">
                        <input type="text"
                               class="form-control search-input global-user-search"
                               data-table="requestTable"
                               placeholder="Search ...">
                    </div>
                </div>

                <div class="responsive-table-wrapper">

                    <table id="requestTable"
                           class="table table-bordered table-hover customTh">

                        <thead>
                        <tr>
                            <th scope="col"
                                style="background-color: gray; color:white;"
                                th:onclick="|window.sortTable('requestTable', 0, this)|">
                                SN
                                <span class="sort-icon">⇅</span>
                            </th>

                            <th scope="col"
                                style="background-color: gray; color:white;"
                                th:onclick="|window.sortTable('requestTable', 1, this)|">
                                Dept Name
                                <span class="sort-icon">⇅</span>
                            </th>

                            <th scope="col"
                                style="background-color: gray; color:white;"
                                th:onclick="|window.sortTable('requestTable', 2, this)|">
                                Category Name
                                <span class="sort-icon">⇅</span>
                            </th>

                            <th scope="col"
                                style="background-color: gray; color:white;"
                                th:onclick="|window.sortTable('requestTable', 3, this)|">
                                Description
                                <span class="sort-icon">⇅</span>
                            </th>

                            <th scope="col"
                                style="background-color: gray; color:white;"
                                th:onclick="|window.sortTable('requestTable', 4, this)|">
                                Request Status
                                <span class="sort-icon">⇅</span>
                            </th>

                            <th scope="col"
                                style="background-color: gray; color:white;"
                                th:onclick="|window.sortTable('requestTable', 5, this)|">
                                Create Time
                                <span class="sort-icon">⇅</span>
                            </th>

                            <th scope="col"
                                style="background-color: gray; color:white;"
                                th:onclick="|window.sortTable('requestTable', 6, this)|">
                                Tracking
                                <span class="sort-icon">⇅</span>
                            </th>

                            <!-- Action column is not sortable -->
                            <th scope="col"
                                style="background-color: gray; color:white;">
                                Action
                            </th>
                        </tr>
                        </thead>

                        <tbody id="requestTableBody">

                        <tr th:each="device, iterStat : ${requestData}">

                            <td th:text="${device.visibleRequestId}">
                                1
                            </td>

                            <td th:text="${device.departmentName}">
                                Department
                            </td>

                            <td th:text="${device.allData[category]}">
                                Category
                            </td>

                            <!-- Description -->
                            <td class="viewInfo description-cell"
                                th:data-request-id="${device.id}">

                                <div th:each="individualColumn : ${requestColumns}"
                                     th:if="${individualColumn.visibleType == 'yes'}"
                                     class="description-item">

                                    <!-- Textarea data type -->
                                    <div th:if="${individualColumn.dataType == 'textarea'}"
                                         class="description-textarea-item">



                                        <div class="expandable-text"
                                             th:data-full-text="${device.allData[individualColumn.columnName]}"
                                             th:text="${device.allData[individualColumn.columnName] ?: 'N/A'}">
                                        </div>
                                    </div>

                                    <!-- Other data types -->
                                    <div th:unless="${individualColumn.dataType == 'textarea'}"
                                         class="description-normal-item">

                                    <span class="description-label"
                                          th:text="${individualColumn.columnName}">
                                    </span>:
                                        <span th:text="${device.allData[individualColumn.columnName] ?: 'N/A'}">
                                    </span>
                                    </div>
                                </div>

                            </td>

                            <!-- Request Status -->
                            <td>
                                <span th:if="${device.requestMode == 'Denied'}">

                                    <a href="#"
                                       th:data-reject-cause="${device.rejectCause}"
                                       onclick="printRejectCause(this); return false;"
                                       style="text-decoration:none">
                                        Denied
                                    </a>
                                </span>

                                <span th:unless="${device.requestMode == 'Denied'}"
                                      th:text="${device.requestMode}">
                                </span>
                            </td>

                            <!-- Create Time -->
                            <td th:text="${device.presentTime}">
                                Create Time
                            </td>

                            <!-- Tracking -->
                            <td onclick="window.trackDeviceRequestData(this.closest('tr'), this)"
                                class="view-device-status"
                                th:data-request-id="${device.id}"
                                style="
                                    background-color: #007bff;
                                    color: #ffffff;
                                    text-align: center;
                                    padding: 10px;
                                    border-radius: 5px;
                                    cursor: pointer;
                                    font-weight: 500;
                                    transition: background-color 0.3s ease;
                                    font-size: 14px;
                                "
                                onmouseover="this.style.backgroundColor='#0056b3'"
                                onmouseout="this.style.backgroundColor='#007bff'"
                                title="View Request data tracking information">
                                View
                            </td>

                            <!-- Actions -->
                            <td>
                                <div class="d-flex justify-content-center align-items-center action-button-container">

                                    <button class="btn btn-sm text-white"
                                            th:data-request-id="${device.id}"
                                            style="background-color:green;"
                                            th:if="${device.requestMode != 'Accepted'}"
                                            title="Accept Device Request">
                                        ✔
                                    </button>

                                    <button class="btn btn-danger btn-sm delete-button"
                                            th:data-request-id="${device.id}"
                                            th:if="${device.requestMode != 'Accepted'
                                                && device.requestMode != 'Denied'}"
                                            title="Cancel Device Request">
                                        &#10007;
                                    </button>
                                </div>
                            </td>
                        </tr>

                        <tr class="last-page-flag"
                            th:data-lastpagerequestData="${lastPagerequestData}"
                            th:data-totalpagerequestData="${totalPagerequestData}"
                            style="display:none;">
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
