<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="UTF-8">
  <title>Analytics Dashboard</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fffaf7;
    }
    .card {
      border-radius: 15px;
      transition: transform 0.2s ease-in-out;
      height: 100%; /* Equal height */
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .dashboard-icon {
      font-size: 2.5rem;
    }
    .row .col {
      display: flex;
    }
    .card-body {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
</head>
<body>
<div th:fragment="analyticFragment">
  <div class="welcome-page p-4 text-center">
    <h2 class="mb-3">🎉 Welcome Home</h2>
    <p class="text-muted">This is your dashboard. Here’s your analytics overview.</p>

    <!-- Stats Cards -->
    <div class="row mt-4 g-4">
      <div class="col-md-3">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <i class="fas fa-users dashboard-icon text-primary mb-2"></i>
            <h5 class="card-title">Total Users</h5>
            <span id="userCount" class="badge bg-primary fs-6 px-3 py-2" th:text="${userCount}">0</span>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <i class="fas fa-laptop dashboard-icon text-success mb-2"></i>
            <h5 class="card-title">Total Devices</h5>
            <span id="deviceCount" class="badge bg-success fs-6 px-3 py-2" th:text="${deviceCount}">0</span>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <i class="fas fa-laptop dashboard-icon text-success mb-2"></i>
            <h5 class="card-title">UnOrdered Devices</h5>
            <span id="deviceCountUnOrdered" class="badge bg-success fs-6 px-3 py-2" th:text="${deviceCountUnOrdered}">0</span>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <i class="fas fa-tools dashboard-icon text-danger mb-2"></i>
            <h5 class="card-title">Servicing</h5>
            <span id="servicingCount" class="badge bg-danger fs-6 px-3 py-2" th:text="${servicingCount}">0</span>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <i class="fas fa-plus-circle dashboard-icon text-warning mb-2"></i>
            <h5 class="card-title">Total Purchase Requests</h5>
            <span id="requestCountTotal" class="badge bg-warning text-dark fs-6 px-3 py-2" th:text="${requestCountTotal}">0</span>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <i class="fas fa-sync-alt dashboard-icon text-info mb-2"></i>
            <h5 class="card-title">Total Purchase Requests Continues</h5>
            <span id="requestCountContinues" class="badge bg-info fs-6 px-3 py-2" th:text="${requestCountContinues}">0</span>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
</body>
</html>
