<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">


<body>
<div th:fragment="leftOffCanvas">
    <div class="offcanvas offcanvas-start show sideoffcanvus" data-bs-scroll="true" data-bs-backdrop="false"
         tabindex="-1" id="offcanvasScrolling" aria-labelledby="offcanvasScrollingLabel"
         style="background-color:#1d4961">
        <div class="offcanvas-body">
            <div class="d-flex flex-column align-items-center justify-content-center" style="margin-left:50px">
                <img th:src="@{/img/sn.png}" alt="User Image"
                     class="rounded-circle"
                     style="width: 80px; height: 80px; object-fit: cover; border: 3px solid white;">
                <div class="text-white mt-2 mb-2 fw-bold">
                    <i class="fas fa-user-tie me-1"></i>
                    <span th:text="${#strings.replace(departmentUserName, 'Department', '').trim()}"></span>
                </div>

            </div>

            <ul class="list-group">
                <li class="list-group-item leftListBgColor" onclick="toggleListItem(this,'analyticFragment')">
                    <i class="fas fa-home me-2"></i> Home
                </li>

                <li class="list-group-item leftListBgColor" onclick="toggleListItem(this,'deviceInformation')">
                    <i class="fas fa-list me-2"></i> Device List
                </li>
                <li class="list-group-item leftListBgColor" onclick="toggleListItem(this,'requestData')">
                    <i class="fas fa-laptop me-2"></i> New Device Request
                </li>
                <li class="list-group-item leftListBgColor" onclick="toggleList(this)">
                    <i class="fas fa-tools me-2"></i> Service Management
                    <i class="fas fa-chevron-down float-end"></i>
                    <ul class="list-group nested-list">
                        <li class="list-group-item leftListBgColor" onclick=" event.stopPropagation();toggleListItem(this,'serviceRequestPending')">
                            <i class="fas fa-clock me-2"></i>Department Service Request
                        </li>
                        <li class="list-group-item leftListBgColor" onclick=" event.stopPropagation(); toggleListItem(this,'serviceRequest')">
                            <i class="fas fa-tools me-2"></i> UpDown Service Center
                        </li>
                    </ul>
                </li>

                 <!-- <li class="list-group-item leftListBgColor" onclick="location.href='/clearCache'">
                    <i class="fas fa-broom me-2"></i> Clear Cache
                </li>-->
                <li class="list-group-item leftListBgColor" data-bs-toggle="modal" data-bs-target="#logoutConfirmModal">
                    <i class="fas fa-sign-out-alt me-2"></i> Logout
                </li>
            </ul>

        </div>
    </div>
</div>

</body>
</html>
